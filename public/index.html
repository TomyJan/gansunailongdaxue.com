<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="__SITE_NAME__，__GO_BTN_TXT__！" />
    <meta
      name="theme-color"
      content="#fdfaf3"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#17130d"
      media="(prefers-color-scheme: dark)"
    />
    <title>__SITE_NAME__</title>
    <link rel="icon" href="__FAVICON_PATH__" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link
      rel="stylesheet"
      href="https://cdn.amoe.cc/web-static/public/font/misans/misans.css"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/motion.js"></script>
    <script defer src="/audio.js"></script>
    <script defer src="/traffic.js"></script>
    <script defer src="/notice.js"></script>
    <script defer src="/footer.js"></script>
    <noscript
      ><style>
        .traffic-stats {
          display: none !important;
        }
      </style></noscript
    >
    <script
      defer
      src="__UMAMI_SCRIPT_URL__"
      data-website-id="__UMAMI_SITE_ID__"
    ></script>
  </head>
  <body>
    <div class="scene is-entering">
      <div class="ambient" aria-hidden="true"></div>
      <div class="orbits" aria-hidden="true">
        <div class="orbit orbit-a">
          <span class="satellite satellite-gold"></span>
        </div>
        <div class="orbit orbit-b">
          <span class="satellite satellite-star">
            <svg
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"
              />
            </svg>
          </span>
        </div>
        <div class="orbit orbit-c">
          <span class="satellite satellite-blue"></span
          ><span class="satellite satellite-small"></span>
        </div>
      </div>
      <div class="grain" aria-hidden="true"></div>
      <main>
        <div class="entry">
          <button class="logo-wrap" type="button" aria-label="播放随机奶龙语音">
            <img
              class="logo"
              src="/logo.png"
              width="104"
              height="104"
              alt="__SITE_NAME__校徽"
            />
          </button>
          <div class="sticker-wrap" aria-hidden="true">
            <span class="sticker"
              >__STICKER_TXT__
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="m10 4 2 6 6 2-6 2-2 6-2-6-6-2 6-2ZM19 2v4m-2-2h4m-1 12v4m-2-2h4"
                /></svg
            ></span>
          </div>
          <span class="star star-a" aria-hidden="true"
            ><svg
              width="27"
              height="27"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"
              /></svg
          ></span>
          <h1>
            __SITE_NAME__<span class="title-dot" aria-hidden="true">.</span>
          </h1>
          <div class="go-wrap">
            <a
              class="go__GO_BTN_CLASS__"
              href="__GO_BTN_TGT__"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="__GO_BTN_TXT__（新窗口打开）"
            >
              <span>__GO_BTN_TXT__</span>
              <svg
                class="go-arrow"
                width="48"
                height="48"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M7 7h10v10M7 17 17 7" />
              </svg>
            </a>
          </div>
          <span class="scribble" aria-hidden="true">LET’S GO!</span>
          <span class="star star-b" aria-hidden="true"
            ><svg
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"
              /></svg
          ></span>
        </div>
      </main>
      <footer>
        <nav class="footer-links" aria-label="相关链接">
          <a
            class="version"
            href="https://github.com/TomyJan/gansunailongdaxue.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub 仓库，当前版本 __COMMIT_SHORT__（新窗口打开）"
            >__COMMIT_SHORT__</a
          >
          <!-- GROUP_START -->
          <a
            href="__GROUP_LINK__"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="加入__GROUP_NAME__奶群（新窗口打开）"
            >加入__GROUP_NAME__奶群</a
          >
          <!-- GROUP_END -->
          <a
            href="https://nai.amoe.cc"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="查找更多奶群和奶站（新窗口打开）"
            >查找更多奶群和奶站</a
          >
          <a href="/terms/">用户协议</a>
          <a href="/privacy/">隐私政策</a>
        </nav>
        <div
          class="traffic-stats"
          aria-label="访问统计"
          aria-live="polite"
          aria-busy="true"
        >
          <span class="traffic-values" hidden>
            <span class="traffic-group"
              ><span>今日</span
              ><span>访客 <span data-count="today-visitors"></span></span
              ><span>浏览 <span data-count="today-pageviews"></span></span
            ></span>
            <span class="traffic-group"
              ><span>总计</span
              ><span>访客 <span data-count="total-visitors"></span></span
              ><span>浏览 <span data-count="total-pageviews"></span></span
            ></span>
            <span class="traffic-group"
              ><span title="最近五分钟内的活跃访客"
                >当前在线 <span data-count="online"></span></span
            ></span>
          </span>
          <button
            class="traffic-refresh"
            type="button"
            aria-label="访问统计加载中"
            disabled
          >
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"
              /></svg
            ><span>访问统计加载中</span>
          </button>
        </div>
      </footer>
    </div>
    <aside
      class="privacy-notice"
      data-version="2026-10-15"
      aria-labelledby="notice-title"
      hidden
    >
      <div>
        <h2 id="notice-title">Cookies 与本地存储</h2>
        <p>
          本站使用 Umami 进行访问统计，默认不使用追踪
          Cookie。我们会在此浏览器中保存提示的已读状态。 详情请阅读<a
            href="/terms/"
            >用户协议</a
          >和<a href="/privacy/">隐私政策</a>。
        </p>
      </div>
      <button type="button">我知道了</button>
    </aside>
  </body>
</html>
